<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claims Dashboard – Oct 2026</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ac:#0e7c66;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mu:#9aa3af;--ac:#3ecfa9;--bd:#2a313a}}
:root[data-theme="dark"]{--bg:#111418;--card:#1a1f26;--tx:#e8eaed;--mu:#9aa3af;--ac:#3ecfa9;--bd:#2a313a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mu);font-size:12px;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
select,button,input[type=file]{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit;max-width:100%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;min-width:0}
.kpi b{display:block;font-size:22px;color:var(--ac)}.kpi span,h2{color:var(--mu);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
h2{margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.r{display:grid;grid-template-columns:minmax(70px,34%) 1fr auto;gap:8px;align-items:center;margin:4px 0;font-size:12px}
.k{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.b{background:var(--bd);border-radius:4px;height:10px}.b i{display:block;height:100%;background:var(--ac);border-radius:4px}
.v{color:var(--mu);font-variant-numeric:tabular-nums}
.tr{display:flex;align-items:flex-end;gap:4px;height:140px;overflow-x:auto}
.col{flex:1 0 28px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.col i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}.col small{font-size:10px;color:var(--mu);margin-top:3px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}
#msg{padding:10px;border-radius:8px;background:var(--card);border:1px solid var(--bd);margin-bottom:12px}.hide{display:none}
</style></head><body><main>
<h1>Claims Performance Dashboard</h1>
<div class="sub" id="st">Loading from Google Sheets…</div>
<div id="msg" class="hide"></div>
<div class="bar" id="f"></div>
<div class="kpis">
<div class="card kpi"><span>Total claim (Rp)</span><b id="k1">–</b></div>
<div class="card kpi"><span>Cases</span><b id="k2">–</b></div>
<div class="card kpi"><span>Avg / case (Rp)</span><b id="k3">–</b></div>
<div class="card kpi"><span>Days with claims</span><b id="k4">–</b></div></div>
<div class="card" style="margin-bottom:10px"><h2>Daily claim amount</h2><div class="tr" id="d"></div></div>
<div class="grid">
<div class="card"><h2>Claim type</h2><div id="t"></div></div>
<div class="card"><h2>Core vs Non-Core</h2><div id="c"></div></div>
<div class="card"><h2>Shipper category</h2><div id="s"></div></div>
<div class="card"><h2>Final region</h2><div id="g"></div></div>
<div class="card"><h2>Final hub – top 10</h2><div id="h"></div></div>
<div class="card"><h2>4PL partner</h2><div id="p"></div></div>
</div>
<div class="card" style="margin-top:10px"><h2>TikTok SLA Breach – cases by rule × delivery attempts</h2><div class="sc" id="x"></div></div>
</main>
<script>
const FILE_ID="1hw0claPehAVzpFzOMSJfvvPvz34PkakosBLqcjp-AxI";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"K":String(n);
let ROWS=[];
function parseCSV(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
else if(c=="\n"){row.push(f.replace(/\r$/,""));r.push(row);row=[];f=""}else f+=c}
if(f||row.length){row.push(f);r.push(row)}return r}
function ingest(text){const t=parseCSV(text),h=t[0].map(x=>x.trim()),ix=n=>h.indexOf(n);
const c={id:ix("tracking_id"),amt:ix("Claim Amount"),dt:ix("Created_at"),cat:ix("Shipper Category"),rule:ix("Rule Name"),type:ix("Claim Type NV"),core:ix("Core/ Non Core"),reg:ix("Final Region"),hub:ix("Final Hub"),att:ix("Delivery Attempt"),pl:ix("4PL"),mo:ix("month")};
ROWS=t.slice(1).filter(x=>x[c.id]).map(x=>{const m=(x[c.dt]||"").split("/");
return{amt:parseInt((x[c.amt]||"0").replace(/,/g,""))||0,date:m.length==3?`${m[2]}-${m[0].padStart(2,"0")}-${m[1].padStart(2,"0")}`:"",
cat:x[c.cat]||"",rule:x[c.rule]||"",type:x[c.type]||"",core:x[c.core]||"",reg:x[c.reg]||"",hub:x[c.hub]||"",att:x[c.att],pl:x[c.pl]||"",mo:x[c.mo]||""}});
$("#st").textContent=`${ROWS.length} claims · loaded ${new Date().toLocaleString()}`;buildFilters();render()}
const FL=[["mo","Month"],["cat","Shipper category"],["type","Claim type"],["core","Core / Non-Core"]];
function buildFilters(){$("#f").innerHTML=FL.map(([k,l])=>`<select id="f_${k}"><option value="">${l}: all</option>${[...new Set(ROWS.map(r=>r[k]))].filter(Boolean).sort().map(v=>`<option>${esc(v)}</option>`).join("")}</select>`).join("");
FL.forEach(([k])=>$("#f_"+k).onchange=render)}
function sum(rs,k){const m={};rs.forEach(r=>m[r[k]]=(m[r[k]]||0)+r.amt);return m}
function bars(id,m,n){const e=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n||99),mx=Math.max(1,...e.map(x=>x[1]));
$(id).innerHTML=e.map(([k,v])=>`<div class="r"><span class="k" title="${esc(k)}">${esc(k||"(blank)")}</span><div class="b"><i style="width:${v/mx*100}%"></i></div><span class="v">${fmt(v)}</span></div>`).join("")||"–"}
function render(){const sel=k=>($("#f_"+k)||{}).value||"";
const rs=ROWS.filter(r=>FL.every(([k])=>!sel(k)||r[k]===sel(k)));
const tot=rs.reduce((a,r)=>a+r.amt,0),days=new Set(rs.map(r=>r.date));
$("#k1").textContent=tot.toLocaleString("en-US");$("#k2").textContent=rs.length;$("#k3").textContent=rs.length?Math.round(tot/rs.length).toLocaleString("en-US"):"–";$("#k4").textContent=days.size;
const dm=sum(rs,"date"),dk=Object.keys(dm).filter(Boolean).sort(),mx=Math.max(1,...dk.map(k=>dm[k]));
$("#d").innerHTML=dk.map(k=>`<div class="col" title="${k}: ${dm[k].toLocaleString("en-US")}"><i style="height:${dm[k]/mx*100}%"></i><small>${k.slice(5)}</small></div>`).join("");
bars("#t",sum(rs,"type"));bars("#c",sum(rs,"core"));bars("#s",sum(rs,"cat"));bars("#g",sum(rs,"reg"));bars("#h",sum(rs,"hub"),10);bars("#p",sum(rs.filter(r=>r.pl),"pl"));
const tt=rs.filter(r=>r.cat.toLowerCase()=="tiktok"&&r.type=="SLA Breach"&&r.rule),B=["0","1–3",">3"],bk=a=>{a=parseInt(a);return isNaN(a)?null:a==0?"0":a<=3?"1–3":">3"},m={};
tt.forEach(r=>{const b=bk(r.att);if(!b)return;(m[r.rule]=m[r.rule]||{"0":0,"1–3":0,">3":0})[b]++});
const rr=Object.entries(m);$("#x").innerHTML=rr.length?`<table><tr><th>Rule</th>${B.map(b=>`<th>${b} attempt</th>`).join("")}<th>Total</th></tr>${rr.map(([k,v])=>`<tr><td>${esc(k)}</td>${B.map(b=>`<td>${v[b]}</td>`).join("")}<td>${B.reduce((a,b)=>a+v[b],0)}</td></tr>`).join("")}</table>`:"No TikTok SLA Breach cases in this selection."}
function b64(s){return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
function note(t,file){const m=$("#msg");m.classList.remove("hide");m.innerHTML=esc(t)+(file?'<br><br>Or load a CSV export of the "Data New" tab: <input type="file" accept=".csv" id="fi">':"");
const fi=$("#fi");if(fi)fi.onchange=e=>e.target.files[0].text().then(ingest)}
async function live(){
let mcp=null;try{mcp=window.claude&&await claude.use("mcp")}catch(e){}
if(!mcp){$("#st").textContent="Live connection unavailable here.";return note("Open this page from your claude.ai artifact link to read the sheet live.",true)}
try{const r=await mcp.callTool("Google Drive","download_file_content",{fileId:FILE_ID,exportMimeType:"text/csv"});
let p=r.payload;if(typeof p=="string"){try{p=JSON.parse(p)}catch(e){}}
if(!p||!p.content)throw{code:"shape"};ingest(b64(p.content))}
catch(e){const c=e&&e.code,M={needs_reauth:"Reconnect Google Drive in claude.ai Settings → Connectors, then reload.",server_not_connected:"Add Google Drive in claude.ai Settings → Connectors, then reload.",not_in_manifest:"Google Drive access was not allowed for this page. Reload and allow it when asked.",consent_required:"Google Drive access was not allowed for this page. Reload and allow it when asked."};
$("#st").textContent="Could not load the sheet.";note(M[c]||"Could not read the sheet ("+(c||"unknown error")+"). Make sure you have access to the Google Sheet.",true)}}
live();
</script></body></html>
